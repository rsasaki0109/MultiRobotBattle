experiment:
  name: gnss_quality_transition
  seed: 42

input:
  scenario: mrn_demos/config/scenarios/gnss_quality_transition_3robots.yaml

methods:
  - name: local_only
    config: mrn_graph/config/dummy_backend.yaml
    graph_executable: dummy_graph_node.py
  - name: coop_graph
    config: mrn_graph/config/gtsam_fixed_lag.yaml
    graph_executable: relative_anchor_graph_node.py

network:
  profile: mrn_netem/config/loss20_delay80.yaml

metrics:
  - ate
  - rpe
  - nees
  - latency
  - bandwidth

# robot_2 loses its RTK fix at 15 s and only fully reacquires at 50 s. While
# the fix is degraded, GNSS covariance balloons (driven by
# mrn_gnss.position_covariance), so cooperative localization should beat
# local-only on robot_2 over the run.
acceptance:
  localization:
    - agent_id: robot_2
      method_run: coop_graph
      method: cooperative
      min_improvement_vs_local: 0.2
      max_ate_rmse: 0.4
      min_availability: 0.95
  network:
    method_run: coop_graph
    min_rows: 3
    min_observed_loss_rate: 0.05
    max_mean_latency_sec: 0.2
