experiment:
  name: bag_replay_smoke
  seed: 42

bag:
  directory: experiments/fixtures/synthetic_bag
  manifest: experiments/fixtures/synthetic_bag/manifest.yaml
  play_rate: 1.0
  agent_ids:
    - robot_1
    - robot_2
  enable_online_ate: false

methods:
  - name: coop_graph
    config: mrn_graph/config/gtsam_fixed_lag.yaml
    graph_executable: relative_anchor_graph_node.py

metrics:
  - ate
  - nees
  - bandwidth

acceptance: {}
