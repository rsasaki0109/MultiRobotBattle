experiment:
  name: backend_comparison
  seed: 42

input:
  scenario: mrn_demos/config/scenarios/gnss_outage_3robots.yaml

# Three-way comparison: local-only baseline, the relative-anchor cooperative
# baseline, and the pure-Python fixed-lag graph backend. The acceptance below
# requires the fixed-lag backend to both beat local-only and match-or-improve
# on the relative-anchor baseline (ATE ratio <= 1.05), which is the v0.4
# acceptance "graph backend improves or matches relative_anchor on synthetic
# outage scenarios" expressed without a GTSAM dependency.
methods:
  - name: local_only
    config: mrn_graph/config/dummy_backend.yaml
    graph_executable: dummy_graph_node.py
  - name: relative_anchor
    config: mrn_graph/config/gtsam_fixed_lag.yaml
    graph_executable: relative_anchor_graph_node.py
  - name: fixed_lag
    config: mrn_graph/config/gtsam_fixed_lag.yaml
    graph_executable: fixed_lag_graph_node.py

metrics:
  - ate
  - rpe
  - nees

acceptance:
  localization:
    # Each cooperative backend must beat local-only during the outage.
    - agent_id: robot_2
      method_run: relative_anchor
      method: cooperative
      min_improvement_vs_local: 0.2
    - agent_id: robot_2
      method_run: fixed_lag
      method: cooperative
      min_improvement_vs_local: 0.2
    # The fixed-lag backend must match or improve on relative_anchor.
    - agent_id: robot_2
      method_run: fixed_lag
      method: cooperative
      max_ate_rmse_ratio_vs_method: 1.05
      vs_method_run: relative_anchor
