name: pages

# Deploy docs/ to GitHub Pages (browser demos + media).
# One-time: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and refresh demo wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          cp dist/mapf_zoo-*.whl docs/demo/
          python3 scripts/verify_wheel.py docs/demo/mapf_zoo-*.whl

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
