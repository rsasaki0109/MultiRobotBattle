name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required docs
        run: |
          test -f README.md
          test -f docs/simulation.md
          test -f docs/coordination.md
          test -f docs/gazebo.md
