name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required docs
        run: |
          test -f README.md
          test -f docs/simulation.md
          test -f docs/coordination.md
          test -f docs/gazebo.md

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify PyPI wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python3 scripts/verify_wheel.py
