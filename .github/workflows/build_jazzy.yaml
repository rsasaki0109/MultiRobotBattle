name: build-jazzy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-yaml
      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --symlink-install
      - name: Test
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Coordination demos
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          # The mrn_coord CLI demos are pure (no ROS daemon): exercise the MAPF
          # planner, the formation controller, and the frontier allocator
          # end-to-end on every push.
          ros2 run mrn_coord mrn_mapf_demo
          ros2 run mrn_coord mrn_mapf_demo --solver prioritized
          ros2 run mrn_coord mrn_mapf_demo --solver ecbs
          ros2 run mrn_coord mrn_mapf_demo --solver lacam
          ros2 run mrn_coord mrn_mapf_demo --solver lns
          ros2 run mrn_coord mrn_mapf_bench --solver prioritized_sipp
          ros2 run mrn_coord mrn_mapf_bench --solver ecbs
          ros2 run mrn_coord mrn_mapf_bench --solver lacam
          ros2 run mrn_coord mrn_mapf_bench --solver lns
          ros2 run mrn_coord mrn_formation_demo
          ros2 run mrn_coord mrn_coverage_demo
          ros2 run mrn_coord mrn_coverage_demo --method greedy
          ros2 run mrn_coord mrn_lifelong_demo --frames 0
          ros2 run mrn_coord mrn_lifelong_demo --frames 0 --allocator auction
          # the local controllers as drop-in benchmark policies
          ros2 run mrn_sim mrn_sim_bench around_obstacle --policy mpc --max-steps 200
          ros2 run mrn_sim mrn_sim_bench doorway --policy mpc_cbf --max-steps 200
          ros2 run mrn_sim mrn_sim_bench doorway --policy mpc_shield --max-steps 200
          # certify the safety shield: the body stays collision-free vs an adversary,
          # and several shielded robots in adversarial mutual pursuit never collide
          python3 scripts/certify_shield.py --check --trials 200
          python3 scripts/certify_shield.py --mode reciprocal --robots 4 --trials 60 --check
          # execute a discrete MAPF plan in the continuous world (plan vs reality)
          ros2 run mrn_sim mrn_mapf_sim --solver lacam
      - name: Benchmark gate
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          # Run the bundled scenarios + MovingAI example and compare their
          # metrics against benchmarks/expected_metrics/. A change that degrades
          # navigation, multi-robot avoidance, or MAPF (fewer goals reached, a
          # new collision, a worse makespan/sum-of-costs) fails the build.
          python3 scripts/benchmark_gate.py

  # Independent of the ROS build: validate that our pure-Python ORCA agrees with
  # the reference RVO2 library it claims to port. RVO2 is built from source here
  # (it is not on PyPI) so the core build never depends on it.
  orca-rvo2-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential python3-dev python3-venv git
      - name: Build the reference RVO2 (Python-RVO2)
        run: |
          python3 -m venv /tmp/rvo2-venv
          . /tmp/rvo2-venv/bin/activate
          pip install --upgrade pip cython setuptools wheel numpy pytest
          # Pin the reference to a known-good commit for reproducibility.
          git clone https://github.com/sybrenstuvel/Python-RVO2.git /tmp/Python-RVO2
          git -C /tmp/Python-RVO2 checkout c2c46ba8d59556aa10faf03479293236efea154d
          pip install --no-build-isolation /tmp/Python-RVO2
          python3 -c "import rvo2; print('rvo2 OK')"
      - name: ORCA == reference RVO2
        run: |
          . /tmp/rvo2-venv/bin/activate
          # The guarded contract: same scenarios through our ORCA and the
          # reference; per-tick velocity agrees to ~machine precision and the
          # safety outcome matches. Diverge beyond tolerance and the build fails.
          python3 scripts/compare_orca_rvo2.py --check
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest mrn_coord/test_mrn_coord/test_orca_rvo2.py -v

  # Independent of the ROS build: validate that our from-scratch CBS computes the
  # same optimal sum-of-costs as the reference libMultiRobotPlanning. The C++
  # `cbs` binary is built from source here so the core build never depends on it.
  mapf-libmrp-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential git \
            libboost-program-options-dev libyaml-cpp-dev python3-pytest
      - name: Build the reference libMultiRobotPlanning cbs
        run: |
          # Pin the reference to a known-good commit for reproducibility.
          git clone https://github.com/whoenig/libMultiRobotPlanning.git /tmp/libMultiRobotPlanning
          git -C /tmp/libMultiRobotPlanning checkout 4c75fa20c435c440d8b6bd6dc81668ddc7296ba0
          cmake -S /tmp/libMultiRobotPlanning -B /tmp/libMultiRobotPlanning/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/libMultiRobotPlanning/build --target cbs -j2
          test -x /tmp/libMultiRobotPlanning/build/cbs && echo "cbs OK"
      - name: CBS == reference libMultiRobotPlanning
        env:
          LIBMRP_CBS: /tmp/libMultiRobotPlanning/build/cbs
        run: |
          # The guarded contract: the same instances through our CBS and the
          # reference must yield the identical optimal sum-of-costs (the unique
          # optimum) and agree on solvability. A mismatch fails the build.
          python3 scripts/compare_mapf_libmrp.py --check
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest mrn_coord/test_mrn_coord/test_mapf_libmrp.py -v
