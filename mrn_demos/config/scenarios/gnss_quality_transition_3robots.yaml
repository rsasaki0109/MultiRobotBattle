scenario:
  name: gnss_quality_transition_3robots
  seed: 42
  duration_sec: 60.0
  update_rate_hz: 20.0

agents:
  - id: robot_1
    base_frame: robot_1/base_link
    odom_frame: robot_1/odom
  - id: robot_2
    base_frame: robot_2/base_link
    odom_frame: robot_2/odom
  - id: robot_3
    base_frame: robot_3/base_link
    odom_frame: robot_3/odom

faults:
  packet_loss_percent: 10
  latency_ms_mean: 60
  clock_drift_ms: 20
  # robot_2 starts with a clean RTK fix, loses the fix entirely (outage),
  # then reacquires through the staged GNSS quality ladder. The GNSS pose
  # covariance is driven by mrn_gnss.position_covariance(quality), so the
  # synthetic world exercises the fix-quality -> covariance path end-to-end
  # without any real RTK data.
  gnss_quality_schedule:
    robot_2:
      - { start_sec: 0.0, fix_quality: RTK_FIX }
      - { start_sec: 15.0, fix_quality: INVALID }    # outage begins
      - { start_sec: 30.0, fix_quality: SINGLE }     # coarse reacquisition
      - { start_sec: 38.0, fix_quality: SBAS }
      - { start_sec: 44.0, fix_quality: RTK_FLOAT }
      - { start_sec: 50.0, fix_quality: RTK_FIX }    # full reacquisition
