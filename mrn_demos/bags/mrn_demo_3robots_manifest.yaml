dataset:
  name: mrn_demo_3robots_gnss_outage
  version: 0.1.0
  ros_distro: jazzy
  storage: mcap
  scenario: mrn_demos/config/scenarios/gnss_outage_3robots.yaml

agents:
  - id: robot_1
    base_frame: robot_1/base_link
    odom_frame: robot_1/odom
  - id: robot_2
    base_frame: robot_2/base_link
    odom_frame: robot_2/odom
  - id: robot_3
    base_frame: robot_3/base_link
    odom_frame: robot_3/odom

topics:
  - name: /clock
    type: rosgraph_msgs/msg/Clock
    required: true
  - name: /tf
    type: tf2_msgs/msg/TFMessage
    required: true
  - name: /tf_static
    type: tf2_msgs/msg/TFMessage
    required: true
  - name: /diagnostics
    type: diagnostic_msgs/msg/DiagnosticArray
    required: false
  - name: /mrn/viz/markers
    type: visualization_msgs/msg/MarkerArray
    required: true
  - name: /mrn/graph/markers
    type: visualization_msgs/msg/MarkerArray
    required: true
  - name: /mrn/graph/status
    type: mrn_msgs/msg/ConstraintGraph
    required: true
  - name: /mrn/eval/summary
    type: mrn_msgs/msg/EvaluationSummary
    required: true
  - name: /robot_1/ground_truth/pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    required: true
  - name: /robot_1/local/odometry
    type: nav_msgs/msg/Odometry
    required: true
  - name: /robot_1/local/gnss_pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    required: true
  - name: /robot_1/mrn/agent_state
    type: mrn_msgs/msg/AgentState
    required: true
  - name: /robot_1/mrn/cooperative_odom
    type: nav_msgs/msg/Odometry
    required: true
  - name: /robot_1/mrn/cooperative_pose
    type: mrn_msgs/msg/CooperativePose
    required: true
  - name: /robot_1/mrn/relative_constraints
    type: mrn_msgs/msg/RelativePoseConstraint
    required: true
  - name: /robot_1/mrn/comm_status
    type: mrn_msgs/msg/CommStatus
    required: true
  - name: /robot_1/mrn/clock_status
    type: mrn_msgs/msg/ClockOffsetEstimate
    required: true
  - name: /robot_2/ground_truth/pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    required: true
  - name: /robot_2/local/odometry
    type: nav_msgs/msg/Odometry
    required: true
  - name: /robot_2/local/gnss_pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    required: true
  - name: /robot_2/mrn/agent_state
    type: mrn_msgs/msg/AgentState
    required: true
  - name: /robot_2/mrn/cooperative_odom
    type: nav_msgs/msg/Odometry
    required: true
  - name: /robot_2/mrn/cooperative_pose
    type: mrn_msgs/msg/CooperativePose
    required: true
  - name: /robot_2/mrn/relative_constraints
    type: mrn_msgs/msg/RelativePoseConstraint
    required: true
  - name: /robot_2/mrn/comm_status
    type: mrn_msgs/msg/CommStatus
    required: true
  - name: /robot_2/mrn/clock_status
    type: mrn_msgs/msg/ClockOffsetEstimate
    required: true
  - name: /robot_3/ground_truth/pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    required: true
  - name: /robot_3/local/odometry
    type: nav_msgs/msg/Odometry
    required: true
  - name: /robot_3/local/gnss_pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    required: true
  - name: /robot_3/mrn/agent_state
    type: mrn_msgs/msg/AgentState
    required: true
  - name: /robot_3/mrn/cooperative_odom
    type: nav_msgs/msg/Odometry
    required: true
  - name: /robot_3/mrn/cooperative_pose
    type: mrn_msgs/msg/CooperativePose
    required: true
  - name: /robot_3/mrn/relative_constraints
    type: mrn_msgs/msg/RelativePoseConstraint
    required: true
  - name: /robot_3/mrn/comm_status
    type: mrn_msgs/msg/CommStatus
    required: true
  - name: /robot_3/mrn/clock_status
    type: mrn_msgs/msg/ClockOffsetEstimate
    required: true

faults:
  packet_loss_percent: 20
  latency_ms_mean: 80
  clock_drift_ms: 30
  gnss_outage:
    robot_2:
      start_sec: 15.0
      duration_sec: 20.0

metrics:
  - ate
  - latency
  - packet_loss
