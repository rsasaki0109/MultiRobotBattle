<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle tournament — pinned matchups</title>
<style>
  :root { --bg:#0f1320; --panel:#1a1f33; --ink:#e8ecf6; --muted:#9aa3bf;
          --red:#ff5b5b; --blue:#5b8cff; --line:#2a3150; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { text-align:center; padding:36px 20px 16px; }
  h1 { margin:0 0 8px; font-size:24px; }
  .sub { color:var(--muted); max-width:680px; margin:0 auto; font-size:15px; }
  main { max-width:820px; margin:0 auto; padding:10px 20px 48px; }
  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .bar { height:8px; border-radius:4px; background:#222a45; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--red); }
  .elo-pos { color:#33d6a6; } .elo-neg { color:var(--red); }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:0 20px 36px; }
  footer a { color:var(--blue); text-decoration:none; }
  .err { color:#ff8b8b; text-align:center; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>Battle tournament ladder</h1>
  <p class="sub">Pinned win-rates from <code>battle_gate</code> — red's advantage over blue
  on each deterministic matchup. ELO delta is a rough ±400·log₁₀(p/(1−p)) scale from 50/50.
  Regenerate with <code>python3 scripts/make_tournament_page.py</code>.</p>
</header>
<main>
  <table>
    <thead>
      <tr>
        <th>Matchup</th>
        <th>Red win %</th>
        <th>Red ELO Δ</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="err" class="err" hidden></p>
</main>
<footer>
  <a href="index.html">Demos</a> ·
  <a href="https://github.com/rsasaki0109/MultiRobotBattle">GitHub</a>
</footer>
<script>
fetch("./tournament.json").then(r => r.json()).then(data => {
  const tb = document.getElementById("rows");
  for (const m of data.matchups || []) {
    const tr = document.createElement("tr");
    const pct = Math.round(100 * m.red_win_rate);
    const elo = m.red_elo_delta;
    const eloCls = elo >= 0 ? "elo-pos" : "elo-neg";
    tr.innerHTML = `
      <td><strong>${m.label}</strong><div class="bar" title="${pct}% red"><i style="width:${pct}%"></i></div></td>
      <td>${pct}%</td>
      <td class="${eloCls}">${elo >= 0 ? "+" : ""}${elo}</td>
      <td style="color:var(--muted);font-size:14px">${m.note || ""}</td>`;
    tb.appendChild(tr);
  }
}).catch(e => {
  document.getElementById("err").hidden = false;
  document.getElementById("err").textContent = "Failed to load tournament.json: " + e;
});
</script>
</body>
</html>
