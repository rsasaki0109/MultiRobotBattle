# ros_gz_bridge config for the swarm world (swarm_demo.sdf): cmd_vel ROS->gz
# and pose gz->ROS for all 12 robots. record_gazebo_swarm_gif.py. Media-only.
- ros_topic_name: "/model/a0/cmd_vel"
  gz_topic_name: "/model/a0/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/model/a0/pose"
  gz_topic_name: "/model/a0/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS
