# ros_gz_bridge config for the ORCA crowd world (orca_demo.sdf): cmd_vel
# ROS->gz and pose gz->ROS for all 8 robots. Used by record_gazebo_orca_gif.py.
# Media-generation only; not part of CI.
- ros_topic_name: "/model/r1/cmd_vel"
  gz_topic_name: "/model/r1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/model/r1/pose"
  gz_topic_name: "/model/r1/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS
