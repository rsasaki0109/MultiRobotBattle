# ros_gz_bridge parameter_bridge config for the 3-robot recording world
# (multirobot_demo.sdf). cmd_vel ROS -> gz, pose gz -> ROS, for robot_1..3.
# Used by scripts/record_gazebo_gif.py to drive the robots from an rclpy
# controller. Media-generation only; not part of CI.
- ros_topic_name: "/model/robot_1/cmd_vel"
  gz_topic_name: "/model/robot_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/model/robot_1/pose"
  gz_topic_name: "/model/robot_1/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/robot_2/cmd_vel"
  gz_topic_name: "/model/robot_2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/model/robot_2/pose"
  gz_topic_name: "/model/robot_2/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/robot_3/cmd_vel"
  gz_topic_name: "/model/robot_3/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/model/robot_3/pose"
  gz_topic_name: "/model/robot_3/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS
